<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastCat Themes</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a; /* koyu arka plan */
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        p {
            max-width: 800px;
            line-height: 1.6;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        a img {
            transition: transform 0.2s;
        }

        a img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <p>
        Since the FastCat script can now preview its themes, the <code>m3tozz.github.io/fastcat-themes</code> site is no longer needed. 
        After selecting either the Large or Small theme section within FastCat, you can use the P (Preview) section to preview the theme you want.
    </p>

    <a href="https://github.com/m3tozz/FastCat" target="_blank">
        <img src="https://img.shields.io/badge/FastCat-000000.svg?&style=for-the-badge&logo=github&logoColor=white" alt="FastCat GitHub">
    </a>
</body>
</html>
